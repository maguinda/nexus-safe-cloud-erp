# Se activa SOLO si cambia este servicio (o su plantilla): publicar billing-receivables no reconstruye los demás.
name: billing-receivables

on:
  pull_request:
    paths:
      - 'services/billing-receivables/**'
      - '.github/workflows/billing-receivables.yml'
      - '.github/workflows/ci-node-service.yml'
      - 'infra/postgres/**'
      - 'infra/keys/gen-keys.sh'
      - 'infra/certs/gen-certs.sh'
  push:
    branches: [main]
    paths:
      - 'services/billing-receivables/**'
      - '.github/workflows/billing-receivables.yml'
      - '.github/workflows/ci-node-service.yml'

# Si llega otro commit al mismo PR, se cancela la corrida anterior (ahorra minutos de Actions: el cupo gratis es de 2.000 al mes).
concurrency:
  group: billing-receivables-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci-node-service.yml
    with:
      path: services/billing-receivables
