# Frontend: tipos, pruebas unitarias y compilación. Las pruebas en navegador corren en stack-e2e.yml (necesitan toda la pila).
name: web

on:
  pull_request:
    paths: ['web/**', '.github/workflows/web.yml']
  push:
    branches: [main]
    paths: ['web/**', '.github/workflows/web.yml']

# Si llega otro commit al mismo PR, se cancela la corrida anterior (ahorra minutos de Actions: el cupo gratis es de 2.000 al mes).
concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
