# Prueba la pila completa como en la demo: contenedores + gateway + flujo de punta a punta + pruebas en navegador
# (Chromium y WebKit, auditoría de pantallas que no escribe). Solo con credenciales de desarrollo; sin secretos del repositorio.
name: stack-e2e

on:
  pull_request:
    paths:
      - 'services/**'
      - 'web/**'
      - 'infra/**'
      - 'scripts/**'
      - 'docker-compose*.yml'
      - '.github/workflows/stack-e2e.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stack:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Keys and environment (development values)
        run: |
          sh infra/keys/gen-keys.sh
          sh infra/certs/gen-certs.sh
          # En el runner (efímero) las llaves privadas deben poder leerlas el usuario "node" del contenedor y el gateway.
          chmod 644 infra/keys/jwt-private.pem infra/certs/*-key.pem
          cp .env.example .env
          # Clave de servicio de la ingesta de telemetría (efímera, solo de este runner): sin ella la ruta responde 503.
          sed -i "s/^INGEST_KEY=.*/INGEST_KEY=$(openssl rand -hex 24)/" .env
      - name: Build and start the stack
        run: docker compose up -d --build
      - name: Wait for the gateway
        run: |
          for i in $(seq 1 60); do curl -sf http://localhost:8080/health >/dev/null && exit 0; sleep 3; done
          docker compose ps; docker compose logs --tail=80; exit 1
      - name: Telemetry simulator logic (pure functions)
        run: node --test scripts/lib/telemetry-slots.test.mjs
      - name: Whole flow through the gateway
        run: |
          set -a; . ./.env; set +a
          node scripts/e2e-flow.mjs
      - name: Install web dependencies and browsers
        working-directory: web
        run: |
          npm ci --ignore-scripts
          npx playwright install --with-deps chromium webkit
      - name: Browser tests (functional and read-only layout audit)
        working-directory: web
        run: sleep 60 && npm run test:e2e
      - name: Logs on failure
        if: failure()
        run: docker compose logs --tail=120
