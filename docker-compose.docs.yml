# Solo para la demo: publica Swagger de cada servicio en 127.0.0.1 (el gateway no lo expone).
# Los servicios exigen mTLS y un navegador no trae carné, así que este archivo abre en cada servicio un SEGUNDO puerto sin TLS
# (DOCS_HTTP_PORT), publicado solo en 127.0.0.1. El JWT sigue siendo obligatorio en toda ruta; lo que se pierde en ese puerto es
# solo la capa mTLS. Sin este archivo esa puerta no existe.
# Uso: docker compose -f docker-compose.yml -f docker-compose.docs.yml up -d
# Swagger: http://localhost:4101/docs (identity), :4102/docs (projects), :4103/docs (billing), :4104/docs (analytics), :4105/docs (notifications), :4106/docs (capacity), :4107/docs (operations).
# Para probar rutas protegidas: POST /auth/login, copia accessToken y pulsa "Authorize".
services:
  identity:
    environment: { DOCS_HTTP_PORT: "4201" }
    ports: ["127.0.0.1:4101:4201"]
  projects:
    environment: { DOCS_HTTP_PORT: "4202" }
    ports: ["127.0.0.1:4102:4202"]
  billing:
    environment: { DOCS_HTTP_PORT: "4203" }
    ports: ["127.0.0.1:4103:4203"]
  analytics:
    environment: { DOCS_HTTP_PORT: "4204" }
    ports: ["127.0.0.1:4104:4204"]
  notifications:
    environment: { DOCS_HTTP_PORT: "4205" }
    ports: ["127.0.0.1:4105:4205"]
  capacity:
    environment: { DOCS_HTTP_PORT: "4206" }
    ports: ["127.0.0.1:4106:4206"]
  operations:
    environment: { DOCS_HTTP_PORT: "4207" }
    ports: ["127.0.0.1:4107:4207"]
