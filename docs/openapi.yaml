openapi: 3.0.3
info:
  title: Nexus Safe-Cloud ERP - MVP API
  version: 0.1.0
  description: |
    Draft contract for the MVP demo (Corte 2). Three services sit behind one gateway:
    identity-access (auth), projects (projects and milestones) and billing-receivables (invoices).

    **Zero Trust.** Every request except `POST /auth/login` and `POST /telemetry/readings` must carry a JWT
    (`Authorization: Bearer <token>`). The token is signed by identity-access (RS256) and each service
    verifies it with the public key, so no service trusts another one by default.

    **Roles.** `project_lead`, `billing_analyst`, `sales`, `manager`. The manager reads the Analytics dashboard (`GET /dashboard`) and administers users (`/users`): every other route answers 403 to it, and those routes answer 403 to every other role. The role comes from the token and
    is checked in the API on every request, not only hidden in the UI.

    | Endpoint | project_lead | billing_analyst | sales | manager |
    |---|---|---|---|---|
    | GET /projects, GET /projects/{id}/milestones | yes | yes | yes | 403 |
    | POST /projects, POST /projects/{id}/milestones | yes | 403 | 403 | 403 |
    | POST /milestones/{id}/approve | yes | 403 | 403 | 403 |
    | GET /invoices | yes | yes | 403 | 403 |
    | GET /invoices/reconciliation | yes | yes | 403 | 403 |
    | PATCH /invoices/{number}/issue | 403 | yes | 403 | 403 |
    | GET /dashboard | 403 | 403 | 403 | yes |
    | GET /telemetry/summary | 403 | 403 | 403 | yes |
    | GET /network/summary, /network/devices, /network/links, /network/facets | 403 | 403 | 403 | yes |
    | GET /telemetry/trends (any `range`), /telemetry/readings, /telemetry/facets | 403 | 403 | 403 | yes |
    | POST /advisor/brief | 403 | 403 | 403 | yes |
    | POST /telemetry/readings (sensors) | service key only: a person's token, whatever the role, answers 401 |
    | PATCH /me/language (your own) | yes | yes | yes | yes |
    | PATCH /me/theme (your own) | yes | yes | yes | yes |
    | GET /users, POST /users, PATCH /users/{id}/role | 403 | 403 | 403 | yes |

    **Session renewal.** The JWT lasts 15 minutes. `POST /auth/login` also sets an opaque renewal token in an `HttpOnly; SameSite=Strict` cookie limited to `/auth` (never in the response body, so page scripts cannot read it). Before the JWT expires the web app calls `POST /auth/refresh` (cookie plus the `X-Requested-With: erp-web` header) and gets a new JWT and a **new** cookie: each renewal spends the token (rotation), so a copied token works once. Using a token that was already spent, outside a 10-second margin for two tabs renewing at once, revokes the whole session. The session ends after 30 minutes without renewing or 8 hours in total; renewal re-reads the person (a role change shows in the new JWT; a deleted person cannot renew). `POST /auth/logout` revokes the session.

    **Sensor ingestion.** `POST /telemetry/readings` is for the sensors (or the simulator), not for people: it takes a service key in the `x-ingest-key` header, never a user token (a manager's token does not work here, and the key opens no other route).
    A batch has 1 to 50 readings and is all or nothing: if any reading is invalid nothing is stored and the 400 lists every problem. It is idempotent per device and instant, so sending a batch again stores nothing new (the answer says how many were duplicates).
    If the server has no key configured (or one shorter than 32 characters) it answers 503 instead of accepting readings.

    **User administration.** Only a manager can list users, create one (with a role and an initial password) and change a role.
    The API re-reads the caller's role in the database, so a manager demoted a moment ago loses access even if their token has not expired.
    You cannot change your own role and the last manager can never lose the role. A new role applies from the next sign-in (tokens last 15 minutes).
    Passwords: 12 characters at least, 72 bytes at most, not containing the email, at least 4 different characters. They are stored only as a bcrypt hash and never returned.

    **Eventual consistency.** Approving a milestone answers 200 right away. Billing creates the draft
    invoice a moment later from the `MilestoneApproved` event (see docs/events.md), so it may not
    appear in `GET /invoices` for a second or two.
servers:
  - url: http://localhost:8080
    description: Local gateway (docker compose)
tags:
  - name: Quotes
    description: Sales quotes with costs and margin (service projects, port 4102). Approving one creates the project and, through QuoteApproved, the contract
  - name: Auth
    description: Owned by identity-access
  - name: Users
    description: Owned by identity-access (manager only)
  - name: Me
    description: Owned by identity-access (the person who signs the token, any role)
  - name: Projects
    description: Owned by projects
  - name: Invoices
    description: Owned by billing-receivables
  - name: Telemetry
    description: Owned by analytics (manager only)
  - name: Network
    description: Owned by analytics (manager only)
  - name: Capacity
    description: Engineers, skills and allocations (service technical-capacity, port 4106). Nobody goes over 100% load on any day.
  - name: Procurement
    description: Suppliers, purchase orders and stock (service procurement, port 4108). An order only moves the stock when it is received.
  - name: Notifications
    description: In-app alerts built from events of other services (service notifications, port 4105). Each role sees its own; read marks are per person.
  - name: Advisor
    description: Owned by analytics (manager only)
security:
  - bearerAuth: []
paths:
  /auth/login:
    post:
      tags: [Auth]
      operationId: login
      summary: Sign in and get a JWT
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Signed in
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /auth/refresh:
    post:
      tags: [Auth]
      operationId: refreshSession
      summary: Renew the session with the renewal cookie (rotation)
      description: "Needs the `erp_refresh` cookie and the header `X-Requested-With: erp-web` (extra defense against cross-site requests). The answer replaces the cookie. Limited per IP (60 per minute by default)."
      security: []
      parameters:
        - { name: X-Requested-With, in: header, required: true, schema: { type: string, enum: [erp-web] } }
      responses:
        '200':
          description: New JWT and the person's data (the renewal token is only in the Set-Cookie header)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginResponse' }
        '401': { description: "No cookie, or it does not exist, expired, was revoked or the person no longer exists - sign in again (the cookie is cleared)", content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '403': { description: Missing X-Requested-With header, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '409': { description: "Another renewal with the same cookie won a moment ago - retry (nothing is revoked, the cookie is kept)", content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '429': { description: Too many renewals from this IP }
  /auth/logout:
    post:
      tags: [Auth]
      operationId: signOut
      summary: Sign out - revokes the whole session and clears the cookie
      security: []
      parameters:
        - { name: X-Requested-With, in: header, required: true, schema: { type: string, enum: [erp-web] } }
      responses:
        '204': { description: Signed out (also when there was no session) }
        '403': { description: Missing X-Requested-With header, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /users:
    get:
      tags: [Users]
      operationId: listUsers
      summary: List users (manager only)
      responses:
        '200':
          description: Users, oldest first. Never includes passwords or hashes.
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/User' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Users]
      operationId: createUser
      summary: Create a user with a role and an initial password (manager only)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateUserRequest' }
      responses:
        '201':
          description: User created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: That email is already registered (any letter case)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429': { description: Too many requests }
  /me/language:
    patch:
      tags: [Me]
      operationId: setMyLanguage
      summary: Change the interface language of the person who signs the token (any role)
      description: |
        Stores `es` or `en` for the caller only: the person comes from the signed token, never from the body, and a body with any
        other field is refused. The next sign-in answers with it (`user.language`). New and existing users start in `es`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [language]
              additionalProperties: false
              properties:
                language: { $ref: '#/components/schemas/Language' }
      responses:
        '200':
          description: The saved language
          content:
            application/json:
              schema:
                type: object
                required: [language]
                properties:
                  language: { $ref: '#/components/schemas/Language' }
        '400':
          description: Language is not es or en, or the body has other fields
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: The person no longer exists
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429': { description: Too many requests }
  /me/theme:
    patch:
      tags: [Me]
      operationId: setMyTheme
      summary: Change the interface theme of the person who signs the token (any role)
      description: |
        Stores `system`, `light` or `dark` for the caller only: the person comes from the signed token, never from the body, and a body with any
        other field is refused. The next sign-in answers with it (`user.theme`). New and existing users start in `system`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [theme]
              additionalProperties: false
              properties:
                theme: { $ref: '#/components/schemas/Theme' }
      responses:
        '200':
          description: The saved theme
          content:
            application/json:
              schema:
                type: object
                required: [theme]
                properties:
                  theme: { $ref: '#/components/schemas/Theme' }
        '400':
          description: Theme is not system, light or dark, or the body has other fields
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: The person no longer exists
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429': { description: Too many requests }
  /users/{id}/role:
    patch:
      tags: [Users]
      operationId: changeUserRole
      summary: Change a user's role (manager only; not your own; never the last manager)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChangeRoleRequest' }
      responses:
        '200':
          description: The user with the new role (unchanged if it already had that role). Applies from the next sign-in.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: You cannot change your own role, or this would remove the last manager
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /projects:
    get:
      tags: [Projects]
      operationId: listProjects
      summary: List projects with their approval progress
      responses:
        '200':
          description: Projects
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Project' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Projects]
      operationId: createProject
      summary: Create a project (role project_lead)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateProjectRequest' }
      responses:
        '201':
          description: Created. The server makes the id; the project starts with no milestones.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Project' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /projects/{projectId}/team:
    get:
      tags: [Projects]
      operationId: listProjectTeam
      summary: Engineers allocated to the project, built from the EngineerAllocated event (roles project_lead, billing_analyst, manager; sales gets 403)
      parameters:
        - { name: projectId, in: path, required: true, schema: { type: string, example: p1 } }
      responses:
        '200':
          description: Up to 200 rows, by start date and engineer name
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    engineerName: { type: string }
                    percent: { type: integer, minimum: 1, maximum: 100 }
                    periodStart: { type: string, format: date }
                    periodEnd: { type: string, format: date }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /projects/{projectId}/milestones:
    get:
      tags: [Projects]
      operationId: listMilestones
      summary: List the milestones of a project
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      responses:
        '200':
          description: Milestones
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Milestone' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [Projects]
      operationId: createMilestone
      summary: Add a pending milestone to a project (role project_lead)
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateMilestoneRequest' }
      responses:
        '201':
          description: Created. It always starts as pending; the server makes the id.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Milestone' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /milestones/{milestoneId}/approve:
    post:
      tags: [Projects]
      operationId: approveMilestone
      summary: Approve a milestone (role project_lead)
      description: |
        In one database transaction the service marks the milestone as approved and writes the
        `MilestoneApproved` event to its outbox table, then answers 200. A relay publishes the event
        to RabbitMQ afterwards.
      parameters:
        - $ref: '#/components/parameters/MilestoneId'
      responses:
        '200':
          description: Approved. The invoice is created asynchronously.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApproveResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: The milestone was already approved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /invoices:
    get:
      tags: [Invoices]
      operationId: listInvoices
      summary: List invoices (roles project_lead and billing_analyst)
      responses:
        '200':
          description: Invoices, newest first
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Invoice' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /invoices/reconciliation:
    get:
      tags: [Invoices]
      operationId: reconcileInvoices
      summary: Milestone-to-invoice reconciliation with tax totals (roles project_lead and billing_analyst)
      responses:
        '200':
          description: One row per invoice linked to its milestone, plus totals
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Reconciliation' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /engineers/{id}/salary:
    patch:
      tags: [Capacity]
      operationId: setStaffMonthlySalary
      summary: Write or clear the MONTHLY payroll salary of a person (role manager). The cost per working day is derived (salary / 22, rounded) and applies to allocations made after the change.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                monthlySalaryCop: { type: integer, nullable: true, minimum: 1, maximum: 200000000 }
      responses:
        '204': { description: Saved }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /quotes:
    get:
      tags: [Quotes]
      operationId: listQuotes
      summary: Quotes with computed cost, price and profit (sales see their own; manager and project_lead see all)
      responses: { '200': { description: The quotes }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' } }
    post:
      tags: [Quotes]
      operationId: createQuote
      summary: Start a quote (draft, margin 25 %) (roles sales, manager)
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [client, projectName], additionalProperties: false, properties: { client: { type: string, minLength: 2, maxLength: 120 }, projectName: { type: string, minLength: 2, maxLength: 120 } } } } } }
      responses: { '201': { description: Created }, '400': { $ref: '#/components/responses/BadRequest' }, '403': { $ref: '#/components/responses/Forbidden' } }
  /quotes/{id}:
    get:
      tags: [Quotes]
      operationId: getQuote
      summary: One quote with its milestones and cost lines
      parameters: [ { name: id, in: path, required: true, schema: { type: string, format: uuid } } ]
      responses: { '200': { description: The quote }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' } }
    put:
      tags: [Quotes]
      operationId: saveQuote
      summary: Replace the whole content of a draft or rejected quote (roles sales (own), manager)
      parameters: [ { name: id, in: path, required: true, schema: { type: string, format: uuid } } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [client, projectName]
              properties:
                client: { type: string }
                projectName: { type: string }
                marginPct: { type: integer, minimum: 0, maximum: 100, default: 25 }
                milestones:
                  type: array
                  maxItems: 30
                  items:
                    type: object
                    properties:
                      name: { type: string }
                      lines:
                        type: array
                        maxItems: 40
                        items: { type: object, properties: { category: { type: string, enum: [materials, supplies, labor] }, description: { type: string }, quantity: { type: integer, minimum: 1, maximum: 100000 }, unitCostCop: { type: integer, minimum: 1, maximum: 1000000000 }, ref: { type: string } } }
      responses: { '200': { description: Saved }, '400': { $ref: '#/components/responses/BadRequest' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' }, '409': { description: The quote is pending or approved } }
  /quotes/{id}/submit:
    post:
      tags: [Quotes]
      operationId: submitQuote
      summary: Send a draft for approval (needs a milestone and a cost line in each)
      parameters: [ { name: id, in: path, required: true, schema: { type: string, format: uuid } } ]
      responses: { '200': { description: Pending }, '409': { description: Not a draft, or incomplete } }
  /quotes/{id}/approve:
    post:
      tags: [Quotes]
      operationId: approveQuote
      summary: Approve a pending quote - the project, its milestones and (through QuoteApproved) the contract are born (role manager)
      parameters: [ { name: id, in: path, required: true, schema: { type: string, format: uuid } } ]
      responses: { '200': { description: Approved }, '403': { $ref: '#/components/responses/Forbidden' }, '409': { description: Not pending } }
  /quotes/{id}/reject:
    post:
      tags: [Quotes]
      operationId: rejectQuote
      summary: Reject a pending quote with a reason of 3 to 300 characters (role manager)
      parameters: [ { name: id, in: path, required: true, schema: { type: string, format: uuid } } ]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [note], properties: { note: { type: string, minLength: 3, maxLength: 300 } } } } } }
      responses: { '200': { description: Rejected }, '409': { description: Not pending } }
  /position-rates:
    get:
      tags: [Capacity]
      operationId: listPositionRates
      summary: Reference monthly salary per position and the cost per working day (roles sales, manager, project_lead)
      responses: { '200': { description: The seven positions } }
  /position-rates/{position}:
    patch:
      tags: [Capacity]
      operationId: setPositionRate
      summary: Adjust the reference salary of a position (role manager)
      parameters: [ { name: position, in: path, required: true, schema: { type: string } } ]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [monthlySalaryCop], properties: { monthlySalaryCop: { type: integer, minimum: 1, maximum: 200000000 }, note: { type: string } } } } } }
      responses: { '204': { description: Saved }, '400': { $ref: '#/components/responses/BadRequest' }, '404': { $ref: '#/components/responses/NotFound' } }
  /quote-catalog:
    get:
      tags: [Procurement]
      operationId: quoteCatalog
      summary: Items some supplier sells, with the lowest reference price (roles sales, manager, project_lead)
      responses: { '200': { description: The catalog } }
  /payroll:
    get:
      tags: [Payroll]
      operationId: listPayroll
      summary: Payroll runs, newest month first (roles manager, finance)
      responses: { '200': { description: The runs }, '403': { $ref: '#/components/responses/Forbidden' } }
    post:
      tags: [Payroll]
      operationId: generatePayroll
      summary: Generate the payroll of a month - a snapshot of everyone with a salary and what each costs the company. One per month (roles manager, finance)
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [period], properties: { period: { type: string, pattern: '^[0-9]{4}-(0[1-9]|1[0-2])$', example: '2026-11' } } } } } }
      responses: { '201': { description: Generated }, '400': { $ref: '#/components/responses/BadRequest' }, '409': { description: That month already has a payroll } }
  /payroll/{id}:
    get:
      tags: [Payroll]
      operationId: getPayroll
      summary: One payroll run with the snapshot line of each person
      parameters: [ { name: id, in: path, required: true, schema: { type: string, format: uuid } } ]
      responses: { '200': { description: The run }, '404': { $ref: '#/components/responses/NotFound' } }
  /payroll/{id}/pay:
    post:
      tags: [Payroll]
      operationId: payPayroll
      summary: Mark a payroll as paid, once (roles manager, finance)
      parameters: [ { name: id, in: path, required: true, schema: { type: string, format: uuid } } ]
      responses: { '200': { description: Paid }, '404': { $ref: '#/components/responses/NotFound' }, '409': { description: Already paid } }
  /payables:
    get:
      tags: [Payables]
      operationId: listPayables
      summary: What is owed to suppliers - one per received order, open first by due date, with the totals owed and overdue (roles manager, finance)
      responses: { '200': { description: The payables }, '403': { $ref: '#/components/responses/Forbidden' } }
  /payables/{id}/pay:
    post:
      tags: [Payables]
      operationId: payPayable
      summary: Pay a payable, once, and announce it (SupplierPaid) (roles manager, finance)
      parameters: [ { name: id, in: path, required: true, schema: { type: string, format: uuid } } ]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [method], properties: { method: { type: string, enum: [transfer, cash, card, check] }, reference: { type: string, minLength: 3, maxLength: 60 } } } } } }
      responses: { '200': { description: Paid }, '400': { $ref: '#/components/responses/BadRequest' }, '404': { $ref: '#/components/responses/NotFound' }, '409': { description: Already paid } }
  /work-orders:
    get:
      tags: [Work orders]
      operationId: listWorkOrders
      summary: Work orders, open ones first (roles manager and project_lead)
      parameters:
        - { name: status, in: query, required: false, schema: { type: string, enum: [open, in_progress, done, cancelled] } }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 200, default: 100 } }
      responses:
        '200': { description: The orders }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Work orders]
      operationId: createWorkOrder
      summary: Create a work order (inspection, preventive or corrective) on a sensor or a network device (role manager)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type, targetKind, targetRef, description]
              properties:
                type: { type: string, enum: [inspection, preventive, corrective] }
                targetKind: { type: string, enum: [sensor, device] }
                targetRef: { type: string, description: The sensor id or the network device id }
                description: { type: string, minLength: 3, maxLength: 300 }
                priority: { type: string, enum: [low, normal, high, critical], default: normal }
                dueDate: { type: string, format: date, description: Not in the past }
                assignedTo: { type: string, description: Name of the person responsible }
                assignedToId: { type: string, format: uuid, description: 'Id of the person in Technical Capacity, chosen from its staff list (needs assignedTo). Operations does not check it exists in the other service' }
                capacityPercent: { type: integer, minimum: 1, maximum: 100, description: Share of the day the order takes (required with assignedToId) }
                capacityStart: { type: string, format: date, description: First day (required with assignedToId) }
                capacityEnd: { type: string, format: date, description: Last day (required with assignedToId) }
                allowOverallocation: { type: boolean, description: Accept going over 100% on purpose }
                sourceNote: { type: string, maxLength: 200 }
      responses:
        '201': { description: Created (OT-0001) }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: There is already an open order of that type for that equipment }
  /work-orders/{id}:
    get:
      tags: [Work orders]
      operationId: getWorkOrder
      summary: One work order with its history
      parameters: [ { name: id, in: path, required: true, schema: { type: string, format: uuid } } ]
      responses:
        '200': { description: The order and its log }
        '404': { $ref: '#/components/responses/NotFound' }
  /work-orders/{id}/status:
    patch:
      tags: [Work orders]
      operationId: setWorkOrderStatus
      summary: open → in_progress → done, or cancelled (role manager). Done and cancelled are final
      parameters: [ { name: id, in: path, required: true, schema: { type: string, format: uuid } } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [status], properties: { status: { type: string, enum: [in_progress, done, cancelled] }, note: { type: string, maxLength: 300 } } }
      responses:
        '200': { description: Changed }
        '409': { description: Not allowed from the current status }
  /work-orders/{id}/assign:
    patch:
      tags: [Work orders]
      operationId: assignWorkOrder
      summary: Set or clear the person responsible while the order is open (role manager)
      parameters: [ { name: id, in: path, required: true, schema: { type: string, format: uuid } } ]
      responses:
        '200': { description: Assigned }
        '409': { description: The order is closed }
  /network/purchased:
    get:
      tags: [Network]
      operationId: listPurchasedDevices
      summary: Devices that came from a purchase, with real serial, warranty and assignee (role manager)
      responses:
        '200': { description: Up to 500 units, newest order first }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /engineers:
    get:
      tags: [Capacity]
      operationId: listEngineers
      summary: Engineers with their load today, the peak of the next 30 days and their current and upcoming allocations (roles project_lead, sales, manager)
      responses:
        '200':
          description: One entry per engineer, by name
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CapacityList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Capacity]
      operationId: createEngineer
      summary: Add an engineer or technician to the staff (role manager). The position (fixed catalog) decides the kind.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, position]
              additionalProperties: false
              properties:
                name: { type: string, minLength: 2, maxLength: 80 }
                position: { type: string, enum: [software_engineer, cloud_devops_engineer, security_engineer, network_engineer, tech_lead, field_technician, support_technician], description: 'field_technician and support_technician are technicians; the rest are engineers' }
                role: { type: string, minLength: 2, maxLength: 60, description: 'Own title; the name of the position when missing' }
                monthlySalaryCop: { type: integer, minimum: 1, maximum: 200000000 }
                skills: { type: array, maxItems: 20, items: { type: string, minLength: 2, maxLength: 40 } }
                certifications: { type: array, maxItems: 20, items: { type: string, minLength: 2, maxLength: 60 } }
      responses:
        '201': { description: Created }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /engineers/{id}/allocations:
    post:
      tags: [Capacity]
      operationId: allocateEngineer
      summary: Allocate an engineer to a project for a period (roles project_lead, manager)
      description: |
        Nobody goes over 100% load on any day. The engineer's row is locked and the allocations are read again inside the lock, so two requests at the same time cannot add up above 100.
        `allowOverallocation` (role manager only, 403 otherwise) accepts going over on purpose; the allocation is stored as such and `OverAllocationDetected` is published.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [projectName, percent, startDate, endDate]
              additionalProperties: false
              properties:
                projectName: { type: string, minLength: 2, maxLength: 80 }
                percent: { type: integer, minimum: 1, maximum: 100 }
                startDate: { type: string, example: '2026-11-02' }
                endDate: { type: string, example: '2026-11-30' }
                allowOverallocation: { type: boolean }
      responses:
        '201': { description: Allocated (`peak` is the highest load of that period afterwards) }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Engineer not found }
        '409': { description: It would put the engineer over 100% on some day; the message names the peak and nothing was saved }
  /allocations/{id}:
    delete:
      tags: [Capacity]
      operationId: deleteAllocation
      summary: Remove an allocation (roles project_lead, manager)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '204': { description: Removed }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Allocation not found }
  /suppliers:
    get:
      tags: [Procurement]
      operationId: listSuppliers
      summary: Suppliers, fixed and by tender (roles manager, project_lead, billing_analyst)
      responses:
        '200': { description: The suppliers by name }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Procurement]
      operationId: createSupplier
      summary: Add a supplier (role manager)
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [name, kind], additionalProperties: false, properties: { name: { type: string, minLength: 2, maxLength: 80 }, kind: { type: string, enum: [fixed, tender] }, terms: { type: string, maxLength: 200 } } }
      responses:
        '201': { description: Created }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { description: A supplier with that name already exists }
  /inventory:
    get:
      tags: [Procurement]
      operationId: listInventory
      summary: Stock of equipment and spare parts (roles manager, project_lead, billing_analyst)
      responses:
        '200': { description: The items with `onHand` }
        '403': { $ref: '#/components/responses/Forbidden' }
  /inventory/movements:
    get:
      tags: [Procurement]
      operationId: listStockMovements
      summary: Stock movement history, newest first (roles manager, project_lead, billing_analyst)
      parameters:
        - { name: itemId, in: query, required: false, schema: { type: string, format: uuid } }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 200, default: 100 } }
      responses:
        '200':
          description: Movements (opening, purchase_received, adjustment) with the balance after and the actor
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id: { type: string, format: uuid }
                    itemId: { type: string, format: uuid }
                    itemName: { type: string }
                    delta: { type: integer }
                    onHandAfter: { type: integer }
                    source: { type: string, enum: [opening, purchase_received, adjustment] }
                    reason: { type: string }
                    actor: { type: string, nullable: true }
                    at: { type: string, format: date-time }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /counts:
    get:
      tags: [Procurement]
      operationId: listStockCounts
      summary: Physical counts, newest first (last 20) (roles manager, project_lead, billing_analyst)
      responses:
        '200': { description: Counts with lines, counted and differences }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Procurement]
      operationId: openStockCount
      summary: Open a physical count (snapshot of the expected stock). Only one can be open (role manager)
      responses:
        '201': { description: Opened }
        '409': { description: There is already an open count }
        '403': { $ref: '#/components/responses/Forbidden' }
  /counts/{id}:
    get:
      tags: [Procurement]
      operationId: getStockCount
      summary: One count with its lines (expected, counted, variance, applied delta)
      parameters: [ { name: id, in: path, required: true, schema: { type: string, format: uuid } } ]
      responses:
        '200': { description: The count }
        '404': { $ref: '#/components/responses/NotFound' }
  /counts/{id}/lines/{itemId}:
    patch:
      tags: [Procurement]
      operationId: setCounted
      summary: Write what was counted for an item while the count is open (role manager)
      parameters: [ { name: id, in: path, required: true, schema: { type: string, format: uuid } }, { name: itemId, in: path, required: true, schema: { type: string, format: uuid } } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [counted], properties: { counted: { type: integer, minimum: 0, maximum: 1000000 } } }
      responses:
        '200': { description: The line }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: The count is not open }
  /counts/{id}/close:
    post:
      tags: [Procurement]
      operationId: closeStockCount
      summary: Close the count and apply counted − expected as adjustments. All or nothing (role manager)
      parameters: [ { name: id, in: path, required: true, schema: { type: string, format: uuid } } ]
      responses:
        '200': { description: Closed, with the adjustments applied }
        '409': { description: Not open, or an item would end below zero }
  /counts/{id}/cancel:
    post:
      tags: [Procurement]
      operationId: cancelStockCount
      summary: Cancel an open count without touching the stock (role manager)
      parameters: [ { name: id, in: path, required: true, schema: { type: string, format: uuid } } ]
      responses:
        '200': { description: Cancelled }
        '409': { description: The count is not open }
  /suppliers/{id}/catalog/{itemId}:
    put:
      tags: [Procurement]
      operationId: setSupplierCatalog
      summary: Say that a supplier sells an item, with a reference price and a delivery time in days (role manager)
      parameters: [ { name: id, in: path, required: true, schema: { type: string, format: uuid } }, { name: itemId, in: path, required: true, schema: { type: string, format: uuid } } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [refPriceCop, leadDays], properties: { refPriceCop: { type: integer, minimum: 1 }, leadDays: { type: integer, minimum: 0, maximum: 365 } } }
      responses:
        '200': { description: Saved }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Procurement]
      operationId: removeSupplierCatalog
      summary: Remove an item from a supplier's catalog; existing orders are not touched (role manager)
      parameters: [ { name: id, in: path, required: true, schema: { type: string, format: uuid } }, { name: itemId, in: path, required: true, schema: { type: string, format: uuid } } ]
      responses:
        '204': { description: Removed }
        '404': { $ref: '#/components/responses/NotFound' }
  /inventory/items/{id}/install:
    post:
      tags: [Procurement]
      operationId: installEquipmentUnit
      summary: Install ONE unit of an equipment item - it leaves the stock and becomes an asset in the network inventory (role manager)
      parameters: [ { name: id, in: path, required: true, schema: { type: string, format: uuid } } ]
      responses:
        '200': { description: Installed (installNumber INS-0001, itemName, onHand left) }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: No stock, or the item is a spare part }
  /installs:
    get:
      tags: [Procurement]
      operationId: listInstalls
      summary: Installed equipment units (INS-0001…) with their status, newest first (roles manager, project_lead, billing_analyst)
      parameters:
        - { name: itemId, in: query, required: false, schema: { type: string, format: uuid } }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 200, default: 100 } }
      responses:
        '200': { description: The installs }
        '400': { $ref: '#/components/responses/BadRequest' }
  /installs/{id}/retire:
    post:
      tags: [Procurement]
      operationId: retireInstalledUnit
      summary: Take an installed unit out of service - back to storage (stock +1) or retired (role manager)
      parameters: [ { name: id, in: path, required: true, schema: { type: string, format: uuid } } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [destination], properties: { destination: { type: string, enum: [storage, retired] } } }
      responses:
        '200': { description: Done }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: The unit is not installed any more }
  /inventory/suggestions:
    get:
      tags: [Procurement]
      operationId: listRestockSuggestions
      summary: Recent sensor alerts with the spare parts that serve that measure (in stock first)
      responses:
        '200': { description: Up to 20 alerts, newest first }
        '403': { $ref: '#/components/responses/Forbidden' }
  /inventory/items:
    post:
      tags: [Procurement]
      operationId: createItem
      summary: Add an item with zero stock (role manager)
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [name, kind], additionalProperties: false, properties: { name: { type: string, minLength: 2, maxLength: 80 }, kind: { type: string, enum: [equipment, spare] }, forKinds: { type: array, maxItems: 10, items: { type: string } } } }
      responses:
        '201': { description: Created }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { description: An item with that name already exists }
  /inventory/items/{id}/adjust:
    post:
      tags: [Procurement]
      operationId: adjustStock
      summary: Adjust the stock by hand; never below 0 (role manager)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [delta, reason], additionalProperties: false, properties: { delta: { type: integer, description: 'Not 0; up to 100000 either way' }, reason: { type: string, minLength: 3, maxLength: 120 } } }
      responses:
        '200': { description: The new stock }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { description: Item not found }
        '409': { description: The stock would go below 0 }
  /orders:
    get:
      tags: [Procurement]
      operationId: listOrders
      summary: Purchase orders, newest first (roles manager, project_lead, billing_analyst)
      responses:
        '200': { description: Up to 200 orders }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Procurement]
      operationId: createOrder
      summary: Create a purchase order; it is pending and does NOT move the stock (role manager)
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [supplierId, itemId, quantity, unitPriceCop], additionalProperties: false, properties: { supplierId: { type: string, format: uuid }, itemId: { type: string, format: uuid }, quantity: { type: integer, minimum: 1, maximum: 100000 }, unitPriceCop: { type: integer, minimum: 1, maximum: 1000000000 } } }
      responses:
        '201': { description: Created as PO-0001, PO-0002… }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { description: Supplier or item not found }
  /orders/{id}/receive:
    post:
      tags: [Procurement]
      operationId: receiveOrder
      summary: Receive an order; the stock goes up ONCE and StockChanged (and EquipmentPurchased for equipment) is published (role manager)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Received; returns the new stock }
        '404': { description: Order not found }
        '409': { description: The order is not pending any more }
  /orders/{id}/cancel:
    post:
      tags: [Procurement]
      operationId: cancelOrder
      summary: Cancel a pending order (role manager)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Cancelled }
        '404': { description: Order not found }
        '409': { description: The order is not pending any more }
  /notifications:
    get:
      tags: [Notifications]
      operationId: listNotifications
      summary: The notifications of my role, newest first, with MY read mark (any role)
      parameters:
        - { name: unread, in: query, schema: { type: boolean }, description: Only the ones I have not read }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 30 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, maximum: 100000, default: 0 } }
      responses:
        '200':
          description: "`total` follows the `unread` filter; `unread` is always how many I have not read"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationList' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /notifications/unread-count:
    get:
      tags: [Notifications]
      operationId: unreadNotificationCount
      summary: How many notifications of my role I have not read
      responses:
        '200':
          description: The count
          content:
            application/json:
              schema: { type: object, required: [unread], properties: { unread: { type: integer } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /notifications/read-all:
    post:
      tags: [Notifications]
      operationId: readAllNotifications
      summary: Mark as read everything my role can see (only for me)
      responses:
        '200':
          description: How many were newly marked
          content:
            application/json:
              schema: { type: object, required: [marked], properties: { marked: { type: integer } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /notifications/{id}/read:
    post:
      tags: [Notifications]
      operationId: readNotification
      summary: Mark one notification as read (only for me; repeating it is fine)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '204': { description: Marked }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { description: It does not exist OR it is not for my role (the answer is the same, so other roles' notifications cannot be probed) }
  /audit:
    get:
      tags: [Audit]
      operationId: getAudit
      summary: Audit log built from every event on the bus (role manager). Append-only; the actor appears only when the event carries it.
      parameters:
        - { name: type, in: query, required: false, schema: { type: string, pattern: '^[A-Za-z]{1,60}$' } }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 200, default: 100 } }
      responses:
        '200':
          description: Newest first, plus the event types present
          content:
            application/json:
              schema:
                type: object
                properties:
                  entries:
                    type: array
                    items:
                      type: object
                      properties:
                        eventId: { type: string, format: uuid }
                        type: { type: string }
                        occurredAt: { type: string, format: date-time }
                        actor: { type: string, nullable: true }
                        summary: { type: string }
                  types: { type: array, items: { type: string } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /profitability:
    get:
      tags: [Profitability]
      operationId: getProfitability
      summary: Profitability per project = issued invoices without VAT minus labor cost (allocation % x working days so far x daily cost) (role manager)
      responses:
        '200':
          description: Projects with revenue, labor cost, margin and how many allocations have no cost yet
          content:
            application/json:
              schema:
                type: object
                properties:
                  asOf: { type: string, format: date-time }
                  projects:
                    type: array
                    items:
                      type: object
                      properties:
                        projectName: { type: string }
                        revenueCop: { type: integer }
                        laborCostCop: { type: integer }
                        marginCop: { type: integer }
                        marginPct: { type: number, nullable: true }
                        allocations: { type: integer }
                        uncostedAllocations: { type: integer }
                  totals: { type: object }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /dashboard:
    get:
      tags: [Dashboard]
      operationId: getDashboard
      summary: Consolidated dashboard from the Analytics read models (role manager)
      description: |
        Built only from business events (MilestoneApproved, InvoiceDrafted, InvoiceIssued); no other service is called.
        Known limit: pending milestones are not shown, because projects does not publish an event when a milestone is created.
      responses:
        '200':
          description: Totals, a per-project table and the recent activity
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Dashboard' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /telemetry/summary:
    get:
      tags: [Telemetry]
      operationId: getTelemetrySummary
      summary: Network and IoT telemetry from the Nexus data loaded into Operations & Telemetry (role manager)
      description: |
        Built from the data of the PROYECTO_NEXUS folder (21 IoT devices and 4200 readings of 2026-09-13), loaded by
        `services/operations/prisma/seed.ts` when `SEED_DEMO=true`. The device state comes from its latest reading;
        the warning and alert counters cover the whole data window. Timestamps carry no zone in the source and are read as UTC.
      responses:
        '200':
          description: Totals, one row per device, one per office and the latest warnings and alerts
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TelemetrySummary' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /telemetry/trends:
    get:
      tags: [Telemetry]
      operationId: getTelemetryTrends
      summary: Sensor trends by office for a time range, the latest alert and warning events, and rule-based findings (role manager)
      parameters:
        - { name: range, in: query, required: false, description: Time range counted back from the latest stored reading; default 1d, schema: { type: string, enum: ['1d', '7d', '30d', '180d', '365d'], default: '1d' } }
      description: |
        Everything in the answer is about ONE range, counted back from the **latest stored reading** (not from the clock: the readings can come in virtual time). With no `range` it is the last 24 hours (`1d`).
        The slot widens with the range so the answer keeps its size: `1d` 10 minutes, `7d` 2 hours, `30d` 6 hours, `180d` 2 days, `365d` 4 days (at most 145 points per office; measured with 190,000 stored readings: 12 months answered in ~100 ms and ~98 KB).
        `series` has one point per office and slot (temperature, humidity, smoke, heater on %, motion, door unlocks, warnings, alerts). `bucketMinutes` is the slot width of the range asked for.
        `window` is still everything stored; `range` says which part this answer covers. `statusCounts` are the readings of the range by status and severity, and `byLocation` counts only the range too.
        `events` carries at most the 300 most recent alerts and warnings of the range, in time order, and `eventsTotal` says how many there are. The findings are computed with at most the 5,000 most recent events of the range.
        `insights` are findings from rules over the data, each with the numbers needed to say it: `simultaneous_alerts` (alerts at the same instant in 2+ offices),
        `periodic_warnings` (the same interval again and again), `warnings_everywhere` or `office_hotter`, and `all_normal`. High severity comes first.
      responses:
        '400':
          description: Unknown range (or the parameter repeated). Nothing is read.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '200':
          description: Series, per-office counters, events and findings
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Trends' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /telemetry/readings:
    get:
      tags: [Telemetry]
      operationId: listTelemetryReadings
      summary: Filterable, sortable and paged list of the loaded readings (role manager)
      description: Filters combine with AND. Names are validated (letters, numbers and a few signs); a bad filter, `from` after `to` or `limit` over 200 answers 400.
      parameters:
        - { name: location, in: query, schema: { type: string }, example: Oficina 1 }
        - { name: deviceKind, in: query, schema: { type: string }, example: Temperature Monitor }
        - { name: deviceId, in: query, schema: { type: string }, example: IOT-OF1-02 }
        - { name: severity, in: query, schema: { type: string, enum: [normal, warning, alert] } }
        - { name: status, in: query, schema: { type: string }, example: WARNING }
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
        - { name: sort, in: query, schema: { type: string, enum: [at, value, status, device], default: at } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, maximum: 100000, default: 0 } }
        - { name: order, in: query, schema: { type: string, enum: [asc, desc], default: desc } }
      responses:
        '200':
          description: Total, page and items
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReadingsPage' }
        '400': { description: A filter is not valid, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Telemetry]
      operationId: ingestTelemetryReadings
      summary: Ingest a batch of new sensor readings (service key, no user token)
      description: Batch of 1 to 50 readings, all or nothing, idempotent per device and instant. A reading needs a known `deviceId`, an ISO 8601 `recordedAt` with a time zone (not in the future), a `status` from the catalog, a finite `value`, the `unit` of that device and an optional `note` (up to 200 characters). Ids are generated by the database.
      security:
        - ingestKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/IngestBatch' }
      responses:
        '200':
          description: How many readings were stored and how many already existed
          content:
            application/json:
              schema: { type: object, required: [accepted, duplicates], properties: { accepted: { type: integer, example: 21 }, duplicates: { type: integer, example: 0 } } }
        '400': { description: The batch is not valid, nothing was stored (the message lists every problem), content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '401': { description: Missing or wrong ingestion key, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '413': { description: Body over 10 KB, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '503': { description: Ingestion is not configured on this server, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /telemetry/facets:
    get:
      tags: [Telemetry]
      operationId: getTelemetryFacets
      summary: Values available for the readings filters, with how many readings each status has (role manager)
      responses:
        '200':
          description: Offices, kinds of device, statuses with counts and the time window
          content:
            application/json:
              schema: { type: object }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /network/devices:
    get:
      tags: [Network]
      operationId: listNetworkDevices
      summary: Filterable, sortable and paged list of the 76 devices of the inventory (role manager)
      parameters:
        - { name: category, in: query, schema: { type: string }, example: Switch Acceso }
        - { name: criticality, in: query, schema: { type: string, enum: [Crítica, Alta, Media] } }
        - { name: monitored, in: query, description: 'yes = the 10 pieces of infrastructure with a monitoring row', schema: { type: string, enum: [yes, no] } }
        - { name: q, in: query, description: Text inside the name, model, role or IP, schema: { type: string, maxLength: 60 } }
        - { name: sort, in: query, schema: { type: string, enum: [id, name, category, criticality, model], default: name } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, maximum: 100000, default: 0 } }
        - { name: order, in: query, schema: { type: string, enum: [asc, desc], default: desc } }
      responses:
        '200':
          description: Total, page and items (a monitored device carries its Syslog, SNMP, NTP and NetFlow flags; the others have null)
          content:
            application/json:
              schema: { type: object }
        '400': { description: A filter is not valid, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /network/links:
    get:
      tags: [Network]
      operationId: listNetworkLinks
      summary: Filterable, sortable and paged list of the 74 links (role manager)
      parameters:
        - { name: linkType, in: query, schema: { type: string }, example: eCopper }
        - { name: criticality, in: query, schema: { type: string, enum: [Crítica, Alta, Media] } }
        - { name: functional, in: query, schema: { type: string, enum: [yes, no, unknown] } }
        - { name: device, in: query, description: Exact device name, as origin or destination, schema: { type: string } }
        - { name: q, in: query, schema: { type: string, maxLength: 60 } }
        - { name: sort, in: query, schema: { type: string, enum: [id, origin, destination, criticality, length], default: id } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, maximum: 100000, default: 0 } }
        - { name: order, in: query, schema: { type: string, enum: [asc, desc], default: desc } }
      responses:
        '200':
          description: Total, page and items
          content:
            application/json:
              schema: { type: object }
        '400': { description: A filter is not valid, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /network/facets:
    get:
      tags: [Network]
      operationId: getNetworkFacets
      summary: Values available for the network filters (role manager)
      responses:
        '200':
          description: Categories, the three criticalities in order and the link types
          content:
            application/json:
              schema: { type: object }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /network/summary:
    get:
      tags: [Network]
      operationId: getNetworkSummary
      summary: Network inventory of Nexus loaded into Operations & Telemetry (role manager)
      description: |
        Built from `Data para Proveedor ERP.xlsx` of the PROYECTO_NEXUS folder (76 devices, 74 links and the monitoring status of the 10 pieces of
        network infrastructure), loaded by `services/operations/prisma/seed.ts` when `SEED_DEMO=true`. Not loaded: interfaces, VLAN/DHCP and the IP/MAC list.
        The repository answers aggregates, never the 150 rows.
      responses:
        '200':
          description: Totals, devices by category and criticality, links, monitoring coverage and the infrastructure list
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NetworkSummary' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /advisor/brief:
    post:
      tags: [Advisor]
      operationId: getAdvisorBrief
      summary: What to do first, from the findings of Sensors and Network (role manager)
      description: |
        Ranks the findings the rules of Sensors and Network already computed and writes, for each one, why it matters and what to do, always citing its evidence.
        With `ai: false` (default) the sentences come from templates and no external call is made. With `ai: true` the model writes them (needs `ANTHROPIC_API_KEY`);
        the server then checks the answer against the findings: every evidence id must exist and every number must appear in the findings, or the whole answer is
        discarded and the rules answer is returned with `fallbackReason` (`invalid`, `error`, `limit` or `unavailable`). The model only reads: it never changes data.
        Besides ids and numbers the check covers device names, invented incidents, causes stated as facts, the temperature threshold shown as a reading, actions that delete data, the
        order of priority and any high-priority finding left out; `violations` lists the codes of what failed (never the text). `playbookVersion` tells which business criteria the agent got.
        Paid calls are capped (6 a minute for the whole service); the free ones are not.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [language]
              additionalProperties: false
              properties:
                language: { type: string, enum: [es, en] }
                ai: { type: boolean, default: false }
      responses:
        '200':
          description: The ranked recommendations with their evidence
          content:
            application/json:
              schema: { type: object }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /invoices/{invoiceNumber}/issue:
    patch:
      tags: [Invoices]
      operationId: issueInvoice
      summary: Issue a draft invoice (role billing_analyst)
      parameters:
        - $ref: '#/components/parameters/InvoiceNumber'
      responses:
        '200':
          description: Issued
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Invoice' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: The invoice is not a draft
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /customers:
    get:
      tags: [Customers (fiscal data)]
      operationId: listCustomers
      summary: 'Fiscal data of the clients (personal data, role billing_analyst only)'
      responses:
        '200': { description: The clients with NIT, check digit, email, address and city, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Customer' } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    put:
      tags: [Customers (fiscal data)]
      operationId: putCustomer
      summary: "Create or update the fiscal data of a client (role billing_analyst). Documents already generated keep their own copy."
      description: "One client per normalized name (no case, accents or extra spaces). The NIT is 6 to 10 digits, optionally with -DV, and the check digit must be right."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CustomerInput' }
      responses:
        '200': { description: Saved, content: { application/json: { schema: { $ref: '#/components/schemas/Customer' } } } }
        '400': { description: 'Invalid data (NIT, check digit, email, texts)', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /contracts:
    get:
      tags: [Contracts]
      operationId: listContracts
      summary: Contracts with what was billed (issued invoices without VAT) and paid on the same project (roles manager, billing_analyst, project_lead)
      responses:
        '200':
          description: Newest first, up to 200
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Contract' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Contracts]
      operationId: createContract
      summary: Create a contract (roles manager, billing_analyst)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [clientName, projectName, amountCop, startDate, endDate]
              properties:
                clientName: { type: string, minLength: 2, maxLength: 120 }
                projectName: { type: string, minLength: 2, maxLength: 120 }
                amountCop: { type: integer, minimum: 1 }
                startDate: { type: string, format: date }
                endDate: { type: string, format: date, description: Not before startDate }
      responses:
        '201':
          description: Created (status active)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Contract' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /contracts/{id}/status:
    patch:
      tags: [Contracts]
      operationId: setContractStatus
      summary: Close or cancel an ACTIVE contract (roles manager, billing_analyst); decided in one statement, so two changes at once cannot both win
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [closed, cancelled] }
      responses:
        '200': { description: Changed }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: The contract is not active }
  /invoices/{invoiceNumber}/payments:
    get:
      tags: [Invoices]
      operationId: listPayments
      summary: Payments of an invoice (roles project_lead, billing_analyst)
      parameters:
        - $ref: '#/components/parameters/InvoiceNumber'
      responses:
        '200':
          description: Payments, oldest first (the person who registered each one is not shown)
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Payment' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [Invoices]
      operationId: registerPayment
      summary: Register a full or partial payment of an ISSUED invoice (role billing_analyst)
      description: The invoice is locked and the paid total is read inside the lock, so two simultaneous payments can never add up above the invoice total. Publishes PaymentReceived in the same transaction.
      parameters:
        - $ref: '#/components/parameters/InvoiceNumber'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amountCop, method]
              properties:
                amountCop: { type: integer, minimum: 1, example: 1000000 }
                method: { type: string, enum: [transfer, cash, card, other] }
                reference: { type: string, maxLength: 60, example: Bank transfer 8841 }
      responses:
        '201':
          description: Registered
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Payment'
                  - type: object
                    properties:
                      paidCop: { type: integer }
                      balanceCop: { type: integer }
                      paymentStatus: { type: string, enum: [unpaid, partial, paid] }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: The invoice is not issued, or the payment is higher than its balance
  /invoices/{invoiceNumber}/electronic:
    post:
      tags: [Electronic invoice (sandbox)]
      operationId: generateElectronicInvoice
      summary: "Generate the SANDBOX electronic document of an issued invoice (role billing_analyst). NOT legally valid."
      description: |
        Builds a UBL 2.1 document with its CUFE (SHA-384 of the Anexo Técnico formula, computed with a TEST technical key, so it is not an official CUFE) and QR text. **SANDBOX – NO LEGAL VALIDITY:**
        it is not signed, it is never sent to the DIAN and it is not a valid electronic sales invoice. A valid one needs a technology provider authorized by the DIAN, a signing certificate,
        a current numbering resolution and the production environment, none of which is connected. Idempotent: asking twice returns the same document. The consecutive comes from a counter row taken inside the
        same transaction (no gaps, no repeats); the numbering range is a SANDBOX range.
      parameters:
        - $ref: '#/components/parameters/InvoiceNumber'
      responses:
        '201': { description: Generated now, content: { application/json: { schema: { $ref: '#/components/schemas/ElectronicInvoice' } } } }
        '200': { description: It already existed (same document), content: { application/json: { schema: { $ref: '#/components/schemas/ElectronicInvoice' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: 'Not ready: not issued, no client, fiscal data of the client missing, the numbering resolution is not valid on the issue date, the IVA is not 19 % of the subtotal, or the range is exhausted', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    get:
      tags: [Electronic invoice (sandbox)]
      operationId: getElectronicInvoice
      summary: "Status of the electronic document, without personal data of the client (role billing_analyst)"
      parameters:
        - $ref: '#/components/parameters/InvoiceNumber'
      responses:
        '200': { description: The document status, content: { application/json: { schema: { $ref: '#/components/schemas/ElectronicInvoice' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /invoices/{invoiceNumber}/electronic/xml:
    get:
      tags: [Electronic invoice (sandbox)]
      operationId: downloadElectronicInvoiceXml
      summary: "Download the UBL 2.1 XML (unsigned, sandbox) (role billing_analyst)"
      description: "Served as an attachment with nosniff. It carries the fiscal data of both parties and the legal notice in Spanish and English."
      parameters:
        - $ref: '#/components/parameters/InvoiceNumber'
      responses:
        '200': { description: The XML, content: { application/xml: { schema: { type: string } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /invoices/{invoiceNumber}/electronic/html:
    get:
      tags: [Electronic invoice (sandbox)]
      operationId: viewElectronicInvoiceHtml
      summary: "Printable representation with the QR and the sandbox banner (role billing_analyst)"
      description: "Built from the invoice as it was when the document was generated. Every text is escaped; the page has no scripts and carries its own content security policy (also sent as a header)."
      parameters:
        - $ref: '#/components/parameters/InvoiceNumber'
      responses:
        '200': { description: The page, content: { text/html: { schema: { type: string } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /invoices/{invoiceNumber}/electronic/submit:
    post:
      tags: [Electronic invoice (sandbox)]
      operationId: submitElectronicInvoice
      summary: "SIMULATE the send to the provider (role billing_analyst)"
      description: "The status becomes `sandbox_simulated` with a SANDBOX-… reference. There is no `accepted` status anywhere. The first call wins; later calls return the same reference."
      parameters:
        - $ref: '#/components/parameters/InvoiceNumber'
      responses:
        '200': { description: Simulated, content: { application/json: { schema: { $ref: '#/components/schemas/ElectronicInvoice' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /invoices/{invoiceNumber}/electronic/deliveries:
    post:
      tags: [Electronic invoice (sandbox)]
      operationId: registerElectronicInvoiceDelivery
      summary: "REGISTER a delivery by email to the client address stored in the document (role billing_analyst)"
      description: "Nothing is sent: no mail server is connected. The recipient cannot be chosen. At most 20 records per document; the 21st answers 409."
      parameters:
        - $ref: '#/components/parameters/InvoiceNumber'
      responses:
        '201': { description: Registered (note says no email was sent), content: { application/json: { schema: { $ref: '#/components/schemas/ElectronicInvoice' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: The delivery registry of the document is full, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    ingestKey:
      type: apiKey
      in: header
      name: x-ingest-key
      description: Service key of the telemetry emitters (sensors, simulator). Not a user token; it opens only POST /telemetry/readings.
  parameters:
    ProjectId:
      name: projectId
      in: path
      required: true
      schema: { type: string, example: p1 }
    MilestoneId:
      name: milestoneId
      in: path
      required: true
      schema: { type: string, example: m2 }
    InvoiceNumber:
      name: invoiceNumber
      in: path
      required: true
      schema: { type: string, example: INV-0103 }
  responses:
    BadRequest:
      description: Invalid request body
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthorized:
      description: Missing, invalid, tampered or expired token
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: The role in the token is not allowed to do this
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: The resource does not exist
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
  schemas:
    Contract:
      type: object
      properties:
        id: { type: string, format: uuid }
        clientName: { type: string }
        projectName: { type: string }
        amountCop: { type: integer }
        startDate: { type: string, format: date }
        endDate: { type: string, format: date }
        status: { type: string, enum: [active, closed, cancelled] }
        createdAt: { type: string, format: date-time }
        billedCop: { type: integer, description: Issued invoices of the same project, without VAT }
        paidCop: { type: integer }
    Payment:
      type: object
      properties:
        id: { type: string, format: uuid }
        invoiceNumber: { type: string, example: INV-0103 }
        amountCop: { type: integer, example: 1000000 }
        method: { type: string, enum: [transfer, cash, card, other] }
        reference: { type: string, nullable: true }
        paidAt: { type: string, format: date-time }
    CapacityList:
      type: object
      required: [today, engineers]
      properties:
        today: { type: string, example: '2026-11-01' }
        engineers:
          type: array
          items:
            type: object
            required: [id, name, role, skills, certifications, loadToday, freeToday, peakNext30, minFreeNext30, allocations]
            properties:
              id: { type: string, format: uuid }
              name: { type: string }
              role: { type: string }
              skills: { type: array, items: { type: string } }
              certifications: { type: array, items: { type: string } }
              loadToday: { type: integer, description: Sum of the percents that cover today }
              freeToday: { type: integer, description: 100 minus the load, never negative }
              peakNext30: { type: integer, description: Highest load of any day in the next 30 days }
              minFreeNext30: { type: integer }
              allocations:
                type: array
                items:
                  type: object
                  required: [id, projectName, percent, startDate, endDate, overAllocated]
                  properties:
                    id: { type: string, format: uuid }
                    projectName: { type: string }
                    percent: { type: integer }
                    startDate: { type: string }
                    endDate: { type: string }
                    overAllocated: { type: boolean }
    NotificationList:
      type: object
      required: [total, unread, items]
      properties:
        total: { type: integer }
        unread: { type: integer }
        items:
          type: array
          items:
            type: object
            required: [id, kind, severity, params, occurredAt, read]
            properties:
              id: { type: string, format: uuid }
              kind: { type: string, enum: [OverdueDetected, ThresholdBreached, OverAllocationDetected], description: The screen writes the text from the kind and its params, in the person's language }
              severity: { type: string, enum: [info, warning, critical] }
              params: { type: object, additionalProperties: { oneOf: [{ type: string }, { type: number }] } }
              occurredAt: { type: string, format: date-time }
              read: { type: boolean, description: Read by ME (not by anyone else) }
    Role:
      type: string
      enum: [project_lead, billing_analyst, sales, manager]
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email, example: laura.rios@nexus.example }
        password: { type: string, minLength: 1, maxLength: 128 }
    Language:
      type: string
      enum: [es, en]
      description: Interface language of a person. Spanish by default.
    Theme:
      type: string
      enum: [system, light, dark]
      description: Interface theme of a person. `system` (the default) follows the light or dark mode of the computer.
    LoginResponse:
      type: object
      required: [accessToken, expiresIn, user]
      properties:
        accessToken: { type: string, description: Signed JWT }
        expiresIn: { type: integer, description: Seconds until the token expires, example: 900 }
        user:
          type: object
          required: [email, name, role, language, theme]
          properties:
            email: { type: string, format: email }
            name: { type: string, example: Laura Ríos }
            role: { $ref: '#/components/schemas/Role' }
            language: { $ref: '#/components/schemas/Language' }
            theme: { $ref: '#/components/schemas/Theme' }
    CreateProjectRequest:
      type: object
      required: [name, client]
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 120, example: Warehouse Wi-Fi rollout }
        client: { type: string, minLength: 1, maxLength: 120, example: Nexus Safe-Cloud }
    CreateMilestoneRequest:
      type: object
      required: [name, amountCop]
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 120, example: Site survey and design }
        amountCop: { type: integer, minimum: 1, maximum: 1000000000, description: 'Whole pesos before VAT. Billing refuses more than 1,000,000,000.', example: 12000000 }
    Project:
      type: object
      required: [id, name, client, milestonesApproved, milestonesTotal]
      properties:
        id: { type: string, example: p1 }
        name: { type: string, example: Branch network upgrade }
        client: { type: string, example: Banco Andino (example) }
        milestonesApproved: { type: integer, example: 1 }
        milestonesTotal: { type: integer, example: 3 }
    Milestone:
      type: object
      required: [id, projectId, name, amountCop, status]
      properties:
        id: { type: string, example: m2 }
        projectId: { type: string, example: p1 }
        name: { type: string, example: Link redundancy design }
        amountCop: { type: integer, description: Amount in Colombian pesos, example: 18500000 }
        status: { type: string, enum: [pending, approved] }
    ApproveResponse:
      type: object
      required: [milestone, eventId]
      properties:
        milestone: { $ref: '#/components/schemas/Milestone' }
        eventId: { type: string, format: uuid, description: Id of the MilestoneApproved event written to the outbox }
    Invoice:
      type: object
      required: [number, projectName, milestoneName, amountCop, taxCop, totalCop, status, createdAt]
      properties:
        number: { type: string, example: INV-0103 }
        projectName: { type: string }
        milestoneName: { type: string }
        amountCop: { type: integer, description: Subtotal (the milestone amount) before tax, example: 18500000 }
        taxCop: { type: integer, description: 'IVA 19 %, whole pesos, rounded to the nearest peso (halves up)', example: 3515000 }
        totalCop: { type: integer, description: subtotal + tax, example: 22015000 }
        status: { type: string, enum: [draft, issued] }
        clientName: { type: string, nullable: true, description: 'The client of the project (it comes in MilestoneApproved); null in invoices older than that field' }
        electronicStatus: { type: string, enum: [not_issued, not_applicable, pending_customer_data, ready, generated, sandbox_simulated], description: 'SANDBOX electronic document: not_issued (draft), not_applicable (no client), pending_customer_data, ready (can be generated), generated, sandbox_simulated. There is no accepted status.' }
        createdAt: { type: string, format: date-time }
        dueDate: { type: string, format: date-time, nullable: true, description: 'Issue date + 30 calendar days (UTC). null while the invoice is a draft; set when it is issued.', example: '2026-11-17T10:00:00.000Z' }
    Customer:
      type: object
      required: [name, nit, dv, email, address, city]
      properties:
        name: { type: string, maxLength: 120, example: Banco Andino (example) }
        nit: { type: string, example: '900000001', description: Digits only, as written }
        dv: { type: integer, minimum: 0, maximum: 9, example: 2, description: Check digit computed from the NIT }
        email: { type: string, example: cuentas@banco.example }
        address: { type: string, maxLength: 200 }
        city: { type: string, maxLength: 80 }
    CustomerInput:
      type: object
      additionalProperties: false
      required: [name, nit, email, address, city]
      properties:
        name: { type: string, minLength: 1, maxLength: 120, description: The client name of the project }
        nit: { type: string, description: '6 to 10 digits, optionally with -DV (it must match the computed check digit); dots and spaces are ignored', example: '900.000.001-2' }
        email: { type: string, maxLength: 254 }
        address: { type: string, maxLength: 200 }
        city: { type: string, maxLength: 80 }
    ElectronicInvoice:
      type: object
      description: 'SANDBOX document status. It never carries the NIT, email or address of the client (they are only inside the XML and the HTML).'
      required: [invoiceNumber, number, cufe, environment, status, signed, validForDian, legalNotice]
      properties:
        invoiceNumber: { type: string, example: INV-0103 }
        number: { type: string, example: FE1000, description: Prefix + consecutive of the (sandbox) numbering range }
        cufe: { type: string, description: '96 hexadecimal characters; computed with a TEST technical key, not official' }
        environment: { type: string, enum: [sandbox] }
        status: { type: string, enum: [generated, sandbox_simulated], description: There is no accepted status }
        signed: { type: boolean, enum: [false] }
        validForDian: { type: boolean, enum: [false] }
        legalNotice: { type: object, properties: { es: { type: string }, en: { type: string } } }
        customerName: { type: string }
        issueDate: { type: string, example: '2026-10-29', description: Colombia time (UTC-5) }
        issueTime: { type: string, example: '10:15:30-05:00' }
        dueDate: { type: string, example: '2026-11-28', description: Issue date + 30 days, Colombia calendar }
        providerRef: { type: string, nullable: true, example: SANDBOX-xxxx }
        submittedAt: { type: string, format: date-time, nullable: true }
        deliveries: { type: integer, description: Delivery records (nothing was sent) }
        createdAt: { type: string, format: date-time }
        note: { type: string, description: Only on the delivery answer }
    Dashboard:
      type: object
      required: [asOf, freshness, totals, projects, recentActivity]
      properties:
        asOf: { type: string, format: date-time }
        freshness:
          type: object
          required: [lastEventAt, lastEventLagMs, eventsProcessed]
          properties:
            lastEventAt: { type: string, format: date-time, nullable: true, description: When the newest event occurred }
            lastEventLagMs: { type: integer, nullable: true, description: Milliseconds between the event occurring and the dashboard receiving it (target at most 60000) }
            eventsProcessed: { type: integer }
        totals:
          type: object
          required: [milestonesPending, overdue, milestonesApproved, approvedCop, waitingForInvoice, draft, issued]
          properties:
            milestonesPending:
              type: object
              description: Milestones created (event MilestoneCreated) and not approved yet
              properties: { count: { type: integer }, cop: { type: integer } }
            overdue:
              type: object
              description: Issued invoices that are past their due day (event OverdueDetected from billing), and what they add up to with IVA
              properties: { count: { type: integer }, totalCop: { type: integer } }
            milestonesApproved: { type: integer }
            approvedCop: { type: integer, description: Sum of the approved subtotals }
            waitingForInvoice:
              type: object
              properties: { count: { type: integer }, cop: { type: integer } }
            draft:
              type: object
              properties: { count: { type: integer }, totalCop: { type: integer, description: Draft invoices with IVA } }
            issued:
              type: object
              properties: { count: { type: integer }, subtotalCop: { type: integer }, taxCop: { type: integer }, totalCop: { type: integer } }
        projects:
          type: array
          description: One row per project, largest approved amount first
          items:
            type: object
            required: [projectName, overdueInvoices, milestonesPending, milestonesApproved, approvedCop, waitingForInvoice, draftTotalCop, issuedTotalCop]
            properties:
              projectName: { type: string }
              overdueInvoices: { type: integer, description: Issued invoices of this project that are past their due day }
              milestonesPending: { type: integer, description: Created milestones not approved yet }
              milestonesApproved: { type: integer }
              approvedCop: { type: integer }
              waitingForInvoice: { type: integer, description: Approved milestones without an invoice yet }
              draftTotalCop: { type: integer }
              issuedTotalCop: { type: integer }
        recentActivity:
          type: array
          description: The latest events, newest first
          items:
            type: object
            properties:
              at: { type: string, format: date-time }
              kind: { type: string, enum: [MilestoneApproved, InvoiceDrafted, InvoiceIssued] }
              message: { type: string }
    TelemetrySummary:
      type: object
      required: [asOf, window, totals, devices, byLocation, attention]
      properties:
        asOf: { type: string, format: date-time }
        window:
          type: object
          nullable: true
          description: First and last reading loaded; null when nothing is loaded
          properties: { from: { type: string, format: date-time }, to: { type: string, format: date-time } }
        totals:
          type: object
          required: [devices, online, readings, normal, warnings, alerts]
          properties:
            devices: { type: integer }
            online: { type: integer, description: Devices whose inventory connection is ONLINE }
            readings: { type: integer }
            normal: { type: integer, description: Readings that are neither WARNING nor ALERT }
            warnings: { type: integer }
            alerts: { type: integer }
        devices:
          type: array
          description: Alerts first, then warnings, devices without readings, and normal ones; ties by office and id
          items:
            type: object
            required: [id, name, kind, location, readingKind, unit, connection, state, lastValue, lastStatus, lastAt, warnings, alerts]
            properties:
              id: { type: string, example: IOT-OF1-02 }
              name: { type: string, example: TEMP_MON_OF1 }
              kind: { type: string, example: Temperature Monitor }
              location: { type: string, example: Oficina 1 }
              readingKind: { type: string, enum: [TEMP, HUMIDITY, STREAM, SMOKE, DETECTION, POWER, STATE] }
              unit: { type: string, example: '°C' }
              connection: { type: string, enum: [ONLINE, OFFLINE] }
              state: { type: string, enum: [normal, warning, alert, no_data], description: Severity of the latest reading }
              lastValue: { type: number, nullable: true }
              lastStatus: { type: string, nullable: true, example: WARNING }
              lastAt: { type: string, format: date-time, nullable: true }
              warnings: { type: integer, description: WARNING readings in the whole window }
              alerts: { type: integer, description: ALERT readings in the whole window }
        byLocation:
          type: array
          items:
            type: object
            required: [location, devices, warnings, alerts, avgTempC, avgHumidityPct]
            properties:
              location: { type: string, example: Oficina 1 }
              devices: { type: integer }
              warnings: { type: integer }
              alerts: { type: integer }
              avgTempC: { type: number, nullable: true, description: Mean of the temperature readings, one decimal }
              avgHumidityPct: { type: number, nullable: true, description: Mean of the humidity readings, one decimal }
        attention:
          type: array
          description: The latest WARNING and ALERT readings, newest first (at most 8)
          items:
            type: object
            required: [at, deviceId, deviceName, location, status, value, unit, note]
            properties:
              at: { type: string, format: date-time }
              deviceId: { type: string }
              deviceName: { type: string }
              location: { type: string }
              status: { type: string, enum: [WARNING, ALERT] }
              value: { type: number }
              unit: { type: string }
              note: { type: string, nullable: true }
    Insight:
      type: object
      required: [code, severity, params]
      description: A finding from a rule over the data; the screen writes the sentence in the person's language from the code and the numbers
      properties:
        code: { type: string, example: simultaneous_alerts }
        severity: { type: string, enum: [high, medium, info] }
        params: { type: object, additionalProperties: true }
    IngestBatch:
      type: object
      required: [readings]
      additionalProperties: false
      properties:
        readings:
          type: array
          minItems: 1
          maxItems: 50
          items:
            type: object
            required: [deviceId, recordedAt, status, value, unit]
            additionalProperties: false
            properties:
              deviceId: { type: string, example: IOT-OF1-02 }
              recordedAt: { type: string, format: date-time, example: '2026-09-13T11:21:00Z' }
              status: { type: string, enum: [ACTIVE, ALERT, CLEAR, DETECTED, LOCKED, NORMAL, OFF, ON, UNLOCKED, WARNING] }
              value: { type: number, example: 22.5 }
              unit: { type: string, example: '°C' }
              note: { type: string, maxLength: 200, nullable: true }
    ReadingsPage:
      type: object
      required: [total, limit, offset, items]
      properties:
        total: { type: integer, description: Readings that match the filters, example: 39 }
        limit: { type: integer }
        offset: { type: integer }
        items:
          type: array
          items:
            type: object
            required: [id, at, deviceId, deviceName, location, deviceKind, readingKind, status, severity, value, unit, note]
            properties:
              id: { type: integer }
              at: { type: string, format: date-time }
              deviceId: { type: string, example: IOT-OF1-02 }
              deviceName: { type: string, example: TEMP_MON_OF1 }
              location: { type: string, example: Oficina 1 }
              deviceKind: { type: string, example: Temperature Monitor }
              readingKind: { type: string, example: TEMP }
              status: { type: string, example: WARNING }
              severity: { type: string, enum: [normal, warning, alert] }
              value: { type: number }
              unit: { type: string }
              note: { type: string, nullable: true }
    Trends:
      type: object
      required: [asOf, bucketMinutes, window, range, statusCounts, eventsTotal, thresholds, locations, series, byLocation, events, insights]
      properties:
        asOf: { type: string, format: date-time }
        bucketMinutes: { type: integer, example: 10, description: Slot width of the range asked for }
        window: { type: object, nullable: true, description: Everything stored (first and last reading) }
        range: { type: object, nullable: true, description: 'The range this answer covers: key (1d, 7d, 30d, 180d, 365d), from and to', properties: { key: { type: string, enum: ['1d', '7d', '30d', '180d', '365d'] }, from: { type: string, format: date-time }, to: { type: string, format: date-time } } }
        statusCounts: { type: array, description: Readings of the range by status, with the severity of each, items: { type: object } }
        eventsTotal: { type: integer, description: How many alerts and warnings the range has (events carries the latest 300 only) }
        thresholds: { type: object, properties: { tempWarningC: { type: number, nullable: true, example: 24 } } }
        locations: { type: array, items: { type: string } }
        series: { type: array, items: { type: object } }
        byLocation: { type: array, items: { type: object } }
        events: { type: array, description: The alerts and warnings, in time order, items: { type: object } }
        insights: { type: array, items: { $ref: '#/components/schemas/Insight' } }
    NetworkSummary:
      type: object
      required: [asOf, totals, byCategory, byCriticality, links, monitoring, infrastructure, insights]
      properties:
        asOf: { type: string, format: date-time }
        totals:
          type: object
          required: [devices, links, criticalDevices, infrastructure]
          properties:
            devices: { type: integer, example: 76 }
            links: { type: integer, example: 74 }
            criticalDevices: { type: integer, description: Devices whose criticality is Crítica, example: 5 }
            infrastructure: { type: integer, description: Pieces of network infrastructure (the ones with a monitoring row), example: 10 }
        byCategory:
          type: array
          description: Biggest first, ties by name
          items: { type: object, required: [category, count], properties: { category: { type: string, example: Laptop }, count: { type: integer } } }
        byCriticality:
          type: array
          description: Always Crítica, Alta, Media (zero when empty), then any other value
          items: { type: object, required: [criticality, count], properties: { criticality: { type: string, example: Crítica }, count: { type: integer } } }
        links:
          type: object
          required: [total, functional, notFunctional, noData, byType, byCriticality]
          properties:
            total: { type: integer }
            functional: { type: integer }
            notFunctional: { type: integer }
            noData: { type: integer, description: Links that do not say whether they work (the IoT ones) }
            byType: { type: array, items: { type: object, properties: { type: { type: string, example: eCopper }, count: { type: integer } } } }
            byCriticality: { type: array, items: { type: object, properties: { criticality: { type: string }, count: { type: integer } } } }
        monitoring:
          type: object
          required: [equipment, syslog, snmp, ntp, netflow, withoutAnyConfig, signalsPossible]
          properties:
            equipment: { type: integer, example: 10 }
            syslog: { type: integer, description: Pieces of equipment with Syslog configured, example: 0 }
            snmp: { type: integer, example: 0 }
            ntp: { type: integer, example: 0 }
            netflow: { type: integer, example: 4 }
            withoutAnyConfig: { type: integer, description: Equipment with none of the four configured, example: 6 }
            signalsPossible: { type: integer, description: Signals each piece could report (CPU, memory, interfaces…), example: 12 }
        insights: { type: array, description: 'Findings: monitoring_basics_missing, critical_unmonitored, netflow_partial, links_without_status, all_covered', items: { $ref: '#/components/schemas/Insight' } }
        infrastructure:
          type: array
          description: Crítica first, then by name
          items:
            type: object
            required: [name, model, role, criticality, ips, syslog, snmp, ntp, netflow, signals]
            properties:
              name: { type: string, example: Multilayer Switch0 }
              model: { type: string, example: 3560-24PS }
              role: { type: string, example: Core / Distribución L3 }
              criticality: { type: string, example: Crítica }
              ips: { type: string, nullable: true, example: 10.0.0.2; 10.0.0.9 }
              syslog: { type: boolean }
              snmp: { type: boolean }
              ntp: { type: boolean }
              netflow: { type: boolean }
              signals: { type: integer, description: How many signals it could report }
    Reconciliation:
      type: object
      required: [rows, summary]
      properties:
        rows:
          type: array
          items:
            type: object
            required: [milestoneId, invoiceNumber, status, subtotalCop, taxCop, totalCop, approvedBy, approvedAt, consistent]
            properties:
              milestoneId: { type: string }
              invoiceNumber: { type: string }
              status: { type: string, enum: [draft, issued] }
              subtotalCop: { type: integer }
              taxCop: { type: integer }
              totalCop: { type: integer }
              approvedBy: { type: string, nullable: true, description: Email of the project lead who approved the milestone }
              approvedAt: { type: string, format: date-time, nullable: true }
              consistent: { type: boolean, description: Stored tax and total equal a fresh calculation from the subtotal }
        summary:
          type: object
          required: [invoices, draft, issued, subtotalCop, taxCop, totalCop, inconsistent]
          properties:
            invoices: { type: integer }
            draft: { type: integer }
            issued: { type: integer }
            subtotalCop: { type: integer }
            taxCop: { type: integer }
            totalCop: { type: integer }
            inconsistent: { type: integer }
    User:
      type: object
      required: [id, email, name, role, createdAt]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email, description: Always lower case, example: carlos.perez@nexus.example }
        name: { type: string, minLength: 1, maxLength: 120, example: Carlos Pérez }
        role: { type: string, enum: [project_lead, billing_analyst, sales, manager] }
        createdAt: { type: string, format: date-time }
    CreateUserRequest:
      type: object
      required: [email, name, role, password]
      additionalProperties: false
      properties:
        email: { type: string, format: email, maxLength: 254 }
        name: { type: string, minLength: 1, maxLength: 120, description: Trimmed; inner spaces collapsed; no control characters }
        role: { type: string, enum: [project_lead, billing_analyst, sales, manager] }
        password: { type: string, minLength: 12, maxLength: 128, description: 'At most 72 bytes in UTF-8 (bcrypt limit); must not contain the email or its name part; at least 4 different characters' }
    ChangeRoleRequest:
      type: object
      required: [role]
      additionalProperties: false
      properties:
        role: { type: string, enum: [project_lead, billing_analyst, sales, manager] }
    Error:
      type: object
      required: [statusCode, error, message]
      properties:
        statusCode: { type: integer, example: 403 }
        error: { type: string, example: Forbidden }
        message: { type: string, example: Role sales cannot read invoices }
        correlationId: { type: string, description: Id to follow the request across services }
