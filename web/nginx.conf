server {
  listen 80;
  server_tokens off;
  root /usr/share/nginx/html;
  index index.html;
  location /assets/ { add_header Cache-Control "public, max-age=31536000, immutable" always; add_header X-Content-Type-Options "nosniff" always; }
  location / { add_header Cache-Control "no-cache" always; add_header X-Content-Type-Options "nosniff" always; try_files $uri /index.html; }
}
