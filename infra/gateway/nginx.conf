# Puerta de entrada única. Los servicios no se publican: solo se llega a ellos por aquí.
# Zero Trust: el gateway NO autentica por su cuenta; reenvía el JWT y cada servicio lo verifica de nuevo.
limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;
# Administración de usuarios (solo el gerente; cada servicio verifica el rol): tope por IP además del tope por ruta de identity.
limit_req_zone $binary_remote_addr zone=admin:10m rate=60r/m;
# Preferencias de cada persona (idioma y tema): su propio tope, para que cambiarlas no gaste el cupo de la administración de usuarios.
limit_req_zone $binary_remote_addr zone=prefs:10m rate=60r/m;
limit_req_zone $binary_remote_addr zone=advisor:10m rate=600r/m;
# Renovación de sesión (POST /auth/refresh y /auth/logout): su propio tope por IP. Cada pestaña renueva una vez cada ~14 minutos, así que 60 por minuto sobra incluso con toda una oficina detrás de una IP.
limit_req_zone $binary_remote_addr zone=session:10m rate=60r/m;
# Ingesta de telemetría (POST /telemetry/readings): su propio tope por IP, para que un emisor descontrolado no gaste el cupo del resto de la API.
# El GET del mismo nombre (el explorador del gerente) no cuenta: con la clave vacía nginx no limita.
map $request_method $ingest_key {
  POST $binary_remote_addr;
  default "";
}
limit_req_zone $ingest_key zone=ingest:10m rate=120r/m;

# Id de correlación: se acepta el del cliente solo si tiene formato seguro; si no, se genera uno.
map $http_x_correlation_id $corr_id {
  default $request_id;
  "~^[A-Za-z0-9._-]{8,64}$" $http_x_correlation_id;
}

server {
  listen 8080;
  # IP real detrás de un balanceador (TRUSTED_PROXIES) y puerto HTTPS opcional: los arma infra/gateway/20-gateway-includes.sh al arrancar (vacíos por defecto).
  include /etc/nginx/conf.d/real-ip.inc;
  include /etc/nginx/conf.d/tls.inc;
  server_tokens off;
  client_max_body_size 16k;
  client_body_timeout 10s;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header Cache-Control "no-store" always;

  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $remote_addr;
  proxy_set_header X-Correlation-Id $corr_id;
  proxy_hide_header X-Powered-By;

  # mTLS hacia los servicios: el gateway presenta su carné y exige el del servidor (firmado por la CA interna, con su nombre).
  # Estas directivas solo aplican a los proxy_pass https:// (la web sigue por http dentro de la red de contenedores).
  proxy_ssl_certificate         /etc/nginx/certs/gateway.pem;
  proxy_ssl_certificate_key     /etc/nginx/certs/gateway-key.pem;
  proxy_ssl_trusted_certificate /etc/nginx/certs/ca.pem;
  proxy_ssl_verify              on;
  proxy_ssl_verify_depth        1;
  proxy_ssl_server_name         on;
  proxy_ssl_protocols           TLSv1.2 TLSv1.3;
  add_header X-Correlation-Id $corr_id always;

  # Solo el login de identity-access queda expuesto, con un límite de intentos por IP.
  location = /auth/login {
    limit_req zone=login burst=5 nodelay;
    limit_req_status 429;
    proxy_pass https://identity:4101;
  }
  # La cookie de renovación (HttpOnly, SameSite=Strict, solo /auth) la pone y la lee identity: nginx solo la deja pasar. Cuerpo de 1 KB: no llevan nada.
  location = /auth/refresh {
    limit_req zone=session burst=20 nodelay;
    limit_req_status 429;
    client_max_body_size 1k;
    proxy_pass https://identity:4101;
  }
  location = /auth/logout {
    limit_req zone=session burst=20 nodelay;
    limit_req_status 429;
    client_max_body_size 1k;
    proxy_pass https://identity:4101;
  }
  # Cerrar sesión en TODOS los dispositivos: lleva el JWT de la persona (identity toma de ahí quién es) y no necesita cuerpo.
  location = /auth/logout-all {
    limit_req zone=session burst=20 nodelay;
    limit_req_status 429;
    client_max_body_size 1k;
    proxy_pass https://identity:4101;
  }
  location ^~ /auth/ { return 404; }

  # Administración de usuarios: identity-access exige JWT con rol manager (y vuelve a mirar el rol en la base).
  location = /users {
    limit_req zone=admin burst=20 nodelay;
    limit_req_status 429;
    proxy_pass https://identity:4101;
  }
  location ^~ /users/ {
    limit_req zone=admin burst=20 nodelay;
    limit_req_status 429;
    proxy_pass https://identity:4101;
  }

  # Cada persona cambia SU idioma: identity-access exige un JWT válido (cualquier rol) y toma la persona del token.
  location = /me/language {
    limit_req zone=prefs burst=20 nodelay;
    limit_req_status 429;
    proxy_pass https://identity:4101;
  }
  location = /me/theme {
    limit_req zone=prefs burst=20 nodelay;
    limit_req_status 429;
    proxy_pass https://identity:4101;
  }

  location ^~ /projects   { proxy_pass https://projects:4102; }
  location ^~ /quotes     { proxy_pass https://projects:4102; }
  location ^~ /milestones { proxy_pass https://projects:4102; }
  location ^~ /invoices   { proxy_pass https://billing:4103; }
  location ^~ /customers  { proxy_pass https://billing:4103; }
  location ^~ /contracts  { proxy_pass https://billing:4103; }
  location ^~ /dashboard  { proxy_pass https://analytics:4104; }
  location ^~ /profitability { proxy_pass https://analytics:4104; }
  location ^~ /cashflow   { proxy_pass https://analytics:4104; }
  location ^~ /project-costs { proxy_pass https://analytics:4104; }
  location ^~ /work-orders { proxy_pass https://operations:4107; }
  location ^~ /audit      { proxy_pass https://analytics:4104; }
  location ^~ /notifications { proxy_pass https://notifications:4105; }
  location ^~ /engineers  { proxy_pass https://capacity:4106; }
  location ^~ /position-rates { proxy_pass https://capacity:4106; }
  location ^~ /payroll    { proxy_pass https://capacity:4106; }
  location ^~ /my-capacity { proxy_pass https://capacity:4106; }
  location ^~ /payables   { proxy_pass https://procurement:4108; }
  location ^~ /suppliers  { proxy_pass https://procurement:4108; }
  location ^~ /inventory  { proxy_pass https://procurement:4108; }
  location ^~ /orders     { proxy_pass https://procurement:4108; }
  location ^~ /counts     { proxy_pass https://procurement:4108; }
  location ^~ /installs   { proxy_pass https://procurement:4108; }
  location ^~ /quote-catalog { proxy_pass https://procurement:4108; }
  location ^~ /allocations { proxy_pass https://capacity:4106; }
  # Un lote de 50 lecturas pesa unos 8 KB: 12 KB de tope. Rutas exactas ganan al prefijo de abajo.
  location = /telemetry/readings {
    limit_req zone=ingest burst=30 nodelay;
    limit_req_status 429;
    client_max_body_size 12k;
    proxy_pass https://operations:4107;
  }
  location ^~ /telemetry  { proxy_pass https://operations:4107; }
  location ^~ /network    { proxy_pass https://operations:4107; }
  # Las recomendaciones por reglas son baratas (se piden cada vez que el gerente abre el tablero, y las pruebas lo hacen cientos de veces); las llamadas a la IA, que cuestan, tienen su tope de 6 por minuto dentro del servicio.
  location = /advisor/brief {
    limit_req zone=advisor burst=100 nodelay;
    limit_req_status 429;
    proxy_pass https://operations:4107;
  }

  # Swagger (/docs) y /health de cada servicio NO se exponen por aquí.
  location = /health {
    default_type application/json;
    return 200 '{"status":"ok"}';
  }

  # Destino de los reportes de la política de contenido (modo solo-reporte): responde 204 y queda en el registro del gateway.
  location = /csp-report {
    limit_except POST { deny all; }
    client_max_body_size 8k;
    default_type application/json;
    return 204;
  }

  # Frontend (un solo origen: sin CORS). Solo la página y sus recursos; cualquier otra ruta es 404.
  # Política de contenido en modo SOLO-REPORTE: no bloquea nada; se revisa en el navegador antes de pasar a bloqueo.
  location = / { include /etc/nginx/conf.d/web-headers.inc; proxy_pass http://web:80; }
  location = /index.html { include /etc/nginx/conf.d/web-headers.inc; proxy_pass http://web:80; }
  location ^~ /assets/ { include /etc/nginx/conf.d/web-headers.inc; proxy_pass http://web:80; }

  location / {
    default_type application/json;
    return 404 '{"statusCode":404,"error":"Not Found","message":"Route not found"}';
  }
}
