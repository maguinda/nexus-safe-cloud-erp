# Infraestructura local del MVP: PostgreSQL (una base por servicio) y RabbitMQ.
# Los puertos solo se publican en 127.0.0.1: nunca se exponen a la red.
services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_ADMIN_USER}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD}
      DB_IDENTITY_PASSWORD: ${DB_IDENTITY_PASSWORD}
      DB_PROJECTS_PASSWORD: ${DB_PROJECTS_PASSWORD}
      DB_BILLING_PASSWORD: ${DB_BILLING_PASSWORD}
      DB_ANALYTICS_PASSWORD: ${DB_ANALYTICS_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_ADMIN_USER} -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 20

  rabbitmq:
    image: rabbitmq:3.13-management
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    volumes:
      - rabbitdata:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 20

  identity:
    build: ./services/identity-access
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      DATABASE_URL: postgresql://identity:${DB_IDENTITY_PASSWORD}@postgres:5432/identity
      JWT_PRIVATE_KEY_PATH: /run/secrets/jwt_private
      JWT_ISSUER: identity-access
      JWT_AUDIENCE: erp-api
      JWT_TTL_SECONDS: ${JWT_TTL_SECONDS:-900}
      LOGIN_RATE_LIMIT: ${LOGIN_RATE_LIMIT:-10}
      SEED_DEMO: ${SEED_DEMO:-false}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-}
      TLS_ENABLED: "true"
      TLS_CERT_PATH: /run/secrets/tls_identity_cert
      TLS_KEY_PATH: /run/secrets/tls_identity_key
      TLS_CA_PATH: /run/secrets/tls_ca
      TLS_ALLOWED_CLIENTS: gateway,identity
    secrets: [jwt_private, tls_ca, tls_identity_cert, tls_identity_key]

  projects:
    build: ./services/projects
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    environment:
      DATABASE_URL: postgresql://projects:${DB_PROJECTS_PASSWORD}@postgres:5432/projects
      JWT_PUBLIC_KEY_PATH: /run/secrets/jwt_public
      JWT_ISSUER: identity-access
      JWT_AUDIENCE: erp-api
      RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672
      SEED_DEMO: ${SEED_DEMO:-false}
      TLS_ENABLED: "true"
      TLS_CERT_PATH: /run/secrets/tls_projects_cert
      TLS_KEY_PATH: /run/secrets/tls_projects_key
      TLS_CA_PATH: /run/secrets/tls_ca
      TLS_ALLOWED_CLIENTS: gateway,projects
    secrets: [jwt_public, tls_ca, tls_projects_cert, tls_projects_key]

  billing:
    build: ./services/billing-receivables
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    environment:
      DATABASE_URL: postgresql://billing:${DB_BILLING_PASSWORD}@postgres:5432/billing
      JWT_PUBLIC_KEY_PATH: /run/secrets/jwt_public
      JWT_ISSUER: identity-access
      JWT_AUDIENCE: erp-api
      RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672
      SEED_DEMO: ${SEED_DEMO:-false}
      TLS_ENABLED: "true"
      TLS_CERT_PATH: /run/secrets/tls_billing_cert
      TLS_KEY_PATH: /run/secrets/tls_billing_key
      TLS_CA_PATH: /run/secrets/tls_ca
      TLS_ALLOWED_CLIENTS: gateway,billing
    secrets: [jwt_public, tls_ca, tls_billing_cert, tls_billing_key]

  analytics:
    build: ./services/analytics
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    environment:
      DATABASE_URL: postgresql://analytics:${DB_ANALYTICS_PASSWORD}@postgres:5432/analytics
      JWT_PUBLIC_KEY_PATH: /run/secrets/jwt_public
      JWT_ISSUER: identity-access
      JWT_AUDIENCE: erp-api
      RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672
      SEED_DEMO: ${SEED_DEMO:-false}
      TLS_ENABLED: "true"
      TLS_CERT_PATH: /run/secrets/tls_analytics_cert
      TLS_KEY_PATH: /run/secrets/tls_analytics_key
      TLS_CA_PATH: /run/secrets/tls_ca
      TLS_ALLOWED_CLIENTS: gateway,analytics
    secrets: [jwt_public, tls_ca, tls_analytics_cert, tls_analytics_key]

  web:
    build: ./web
    restart: unless-stopped

  gateway:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      web: { condition: service_healthy }
      identity: { condition: service_healthy }
      projects: { condition: service_healthy }
      billing: { condition: service_healthy }
      analytics: { condition: service_healthy }
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./infra/gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./infra/gateway/web-headers.inc:/etc/nginx/conf.d/web-headers.inc:ro
      # Carné del gateway y CA pública (la llave de la CA nunca se monta).
      - ./infra/certs/gateway.pem:/etc/nginx/certs/gateway.pem:ro
      - ./infra/certs/gateway-key.pem:/etc/nginx/certs/gateway-key.pem:ro
      - ./infra/certs/ca.pem:/etc/nginx/certs/ca.pem:ro

secrets:
  jwt_private:
    file: ./infra/keys/jwt-private.pem
  jwt_public:
    file: ./infra/keys/jwt-public.pem
  tls_ca:
    file: ./infra/certs/ca.pem
  tls_identity_cert:
    file: ./infra/certs/identity.pem
  tls_identity_key:
    file: ./infra/certs/identity-key.pem
  tls_projects_cert:
    file: ./infra/certs/projects.pem
  tls_projects_key:
    file: ./infra/certs/projects-key.pem
  tls_billing_cert:
    file: ./infra/certs/billing.pem
  tls_billing_key:
    file: ./infra/certs/billing-key.pem
  tls_analytics_cert:
    file: ./infra/certs/analytics.pem
  tls_analytics_key:
    file: ./infra/certs/analytics-key.pem

volumes:
  pgdata:
  rabbitdata:
